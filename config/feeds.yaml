# RSS 來源清單
# 對應規格 §3.1
# 每個來源必須有穩定的 source_id；程式碼以 source_id 為唯一識別，不以 name 判斷。
#
# 欄位說明：
#   source_id : 穩定識別碼（snake_case）
#   name      : 顯示名稱
#   publisher : 出版者
#   url       : RSS URL
#   beats     : 預設 beat 候選（陣列）
#   sub_beat  : ARTS 子分類（可選）
#   lang      : en | zh-TW
#   tier      : 1 (核心) | 2 (補充) | 3 (專題) | "TW" (台灣)
#   transport : direct_rss | google_news_proxy | rsshub
#   is_proxy  : true 時為 proxy 來源，非原媒體官方 RSS
#   enabled   : 是否啟用
#   note      : 備註（可選）

sources:
  # ---------- BBC ----------
  - source_id: bbc_world
    name: "BBC World"
    publisher: "BBC"
    url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    beats: [INTL]
    lang: en
    tier: 1
    transport: direct_rss
    is_proxy: false
    enabled: true

  - source_id: bbc_business
    name: "BBC Business"
    publisher: "BBC"
    url: "https://feeds.bbci.co.uk/news/business/rss.xml"
    beats: [ECON]
    lang: en
    tier: 1
    transport: direct_rss
    is_proxy: false
    enabled: true

  - source_id: bbc_technology
    name: "BBC Technology"
    publisher: "BBC"
    url: "https://feeds.bbci.co.uk/news/technology/rss.xml"
    beats: [AI]
    lang: en
    tier: 1
    transport: direct_rss
    is_proxy: false
    enabled: true

  # ---------- Reuters (via Google News proxy) ----------
  - source_id: reuters_world_google_news
    name: "Reuters World via Google News"
    publisher: "Reuters"
    url: "https://news.google.com/rss/search?q=when:24h+allinurl:reuters.com&hl=en"
    beats: [INTL, ECON]
    lang: en
    tier: 1
    transport: google_news_proxy
    is_proxy: true
    enabled: true
    note: "Reuters direct public RSS is not assumed. Google News proxy must be treated as unstable."

  - source_id: reuters_business_google_news
    name: "Reuters Business via Google News"
    publisher: "Reuters"
    url: "https://news.google.com/rss/search?q=when:24h+allinurl:reuters.com/business&hl=en"
    beats: [ECON]
    lang: en
    tier: 1
    transport: google_news_proxy
    is_proxy: true
    enabled: true

  # ---------- AP (via RSSHub) ----------
  - source_id: ap_world_rsshub
    name: "AP News World via RSSHub"
    publisher: "AP"
    url: "https://rsshub.app/apnews/topics/world-news"
    beats: [INTL]
    lang: en
    tier: 1
    transport: rsshub
    is_proxy: true
    enabled: true
    note: "Requires self-hosted or stable RSSHub instance."

  # ---------- Al Jazeera / NPR ----------
